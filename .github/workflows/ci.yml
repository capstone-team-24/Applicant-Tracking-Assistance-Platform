name: CI Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Java Services ──────────────────────────────────────
  build-java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - backend/eureka-server
          - backend/auth-service
          - backend/user-service
          - backend/jobs-service
          - backend/api-gateway
          - backend/notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: mvn -B test
        continue-on-error: true

  # ─── Python Services ────────────────────────────────────
  build-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ml/hiring-rag-service
          - ml/assessment-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: pytest tests/ -v --tb=short || true
        continue-on-error: true

  # ─── Frontend ────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/client/package-lock.json

      - name: Install dependencies
        working-directory: frontend/client
        run: npm ci || npm install

      - name: Build
        working-directory: frontend/client
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # ─── Docker Build ────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [build-java, build-python, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build --parallel
